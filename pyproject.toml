[project]
name = "dgalert"
version = "0.1.0"
description = "Classify domain names as benign or DGA-generated, served with FastAPI."
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["venv", "mlruns"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, B: bugbear, UP: pyupgrade, SIM: simplify, N: naming
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "sanity: checks on the real trained model in models/latest.json (skipped when it is absent)",
]
